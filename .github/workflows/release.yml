name: Release wp-ai-customer-service Plugin

# 触发: 打 v*.*.* tag (如 v1.2.1) 或 手动在 Actions 页点 "Run workflow"
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包插件 zip (排除非运行时文件)
        run: |
          mkdir -p dist
          zip -r dist/wp-ai-customer-service.zip . \
            -x ".git/*" \
            -x "tests/*" \
            -x "*.md" \
            -x "*.zip" \
            -x "*.tar.gz" \
            -x ".githooks/*" \
            -x ".github/*" \
            -x "deploy.ps1" \
            -x "logs/*"
          echo "=== zip contents 前 20 项 ==="
          unzip -l dist/wp-ai-customer-service.zip | head -20

      - name: 创建 GitHub Release 并上传 zip
        uses: softprops/action-gh-release@v2
        # 修复问题 1: tag 触发 或 手动触发(workflow_dispatch)都创建 Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: dist/wp-ai-customer-service.zip
          generate_release_notes: true
          # 手动触发时若没有对应 tag, 生成一个 draft release 供人工发布
          draft: ${{ github.event_name == 'workflow_dispatch' }}

  # =========================================================================
  # 生产部署(可选): 把 Release 上的 zip 部署到线上 WordPress 服务器
  #
  # 启用条件(修复问题 2): 在仓库 Settings → Secrets and variables → Actions → Variables 添加:
  #   ENABLE_PROD_DEPLOY = true
  # 并在 Secrets 中添加:
  #   PROD_WP_SSH_HOST       生产服务器 IP/域名 (如 prod.example.com)
  #   PROD_WP_SSH_PORT       SSH 端口 (共享主机常见 18765/2222/7822, 默认 22)
  #   PROD_WP_SSH_USER       SSH 登录用户名 (如 wpdeploy 或 u3031-xxx)
  #   PROD_WP_SSH_KEY        SSH 私钥内容 (对应服务器 authorized_keys)
  #   PROD_WP_PLUGINS_DIR    WordPress 插件目录绝对路径 (如 /var/www/html/wp-content/plugins)
  #
  # 同时在 Settings → Environments 创建 production 环境(可配 required reviewers 审批)
  # 不需要生产部署时, 不配置上述 variable, 此 job 自动跳过
  # =========================================================================
  deploy-production:
    needs: build-release
    # 修复问题 2: 用 repository variable 控制开关, 默认不运行(不卡在 environment)
    if: startsWith(github.ref, 'refs/tags/') && vars.ENABLE_PROD_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # 修复问题 3: 用 gh CLI + GITHUB_TOKEN 从 Release 下载(支持私有仓库)
      # GITHUB_TOKEN 由 Actions 自动注入, 无需额外配置; 在 runner 下载后通过 scp 传到生产服务器
      # token 不会暴露给生产服务器
      - name: 从 GitHub Release 下载 zip (带认证, 支持私有仓库)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "[deploy] 从 Release ${TAG} 下载 zip"
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "wp-ai-customer-service.zip" \
            --dir /tmp
          ls -lh /tmp/wp-ai-customer-service.zip

      # appleboy/scp-action 对 ed25519 OPENSSH key + 非标准端口(18765)兼容性差
      # 改用 base64 编码 + ssh-action 传输, 规避 SCP 协议层问题
      - name: 准备 zip (base64 编码)
        run: |
          echo "[deploy] base64 编码 zip"
          B64=$(base64 /tmp/wp-ai-customer-service.zip)
          echo "ZIP_BASE64=${B64}" >> $GITHUB_ENV
          echo "[deploy] base64 长度: ${#B64} 字符"

      - name: 通过 SSH base64 传输 zip 到服务器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.PROD_WP_SSH_HOST }}
          username: ${{ secrets.PROD_WP_SSH_USER }}
          key:      ${{ secrets.PROD_WP_SSH_KEY }}
          port:     ${{ secrets.PROD_WP_SSH_PORT }}
          envs: ZIP_BASE64
          command_timeout: 60s
          script: |
            echo "[deploy] 解码 base64 -> /tmp/wp-ai-customer-service.zip"
            echo "${ZIP_BASE64}" | base64 -d > /tmp/wp-ai-customer-service.zip
            ls -lh /tmp/wp-ai-customer-service.zip
            file /tmp/wp-ai-customer-service.zip

      - name: SSH 解压并部署到 WordPress 插件目录
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.PROD_WP_SSH_HOST }}
          username: ${{ secrets.PROD_WP_SSH_USER }}
          key:      ${{ secrets.PROD_WP_SSH_KEY }}
          port:     ${{ secrets.PROD_WP_SSH_PORT }}
          # ssh-action 默认环境变量可能不全, 加 envs 把插件目录直接作为 shell 变量用
          envs: PLUGINS_DIR
          # 防止共享主机 PATH 不包含 /usr/local/bin 之类导致 unzip/rm 找不到
          command_timeout: 180s
          script_stop: true
          script: |
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            PLUGINS_DIR="${{ secrets.PROD_WP_PLUGINS_DIR }}"
            TMP_ZIP="/tmp/wp-ai-customer-service.zip"
            TARGET_DIR="${PLUGINS_DIR}/wp-ai-customer-service"

            # === 安全前置检查 ===
            # 1) PLUGINS_DIR 必须已存在且能写(否则直接失败不破坏任何东西)
            if [ ! -d "${PLUGINS_DIR}" ]; then
              echo "[deploy] FAIL: PLUGINS_DIR 不存在: ${PLUGINS_DIR}" >&2
              echo "       请用 init-deploy-user.sh 探测实际路径, 再填 PROD_WP_PLUGINS_DIR" >&2
              exit 2
            fi
            if [ ! -w "${PLUGINS_DIR}" ]; then
              echo "[deploy] FAIL: PLUGINS_DIR 无写权限: ${PLUGINS_DIR}" >&2
              echo "       当前用户: $(whoami)  目录 owner: $(stat -c '%U:%G' "${PLUGINS_DIR}")  权限: $(stat -c '%a' "${PLUGINS_DIR}")" >&2
              exit 3
            fi
            # 2) zip 必须存在且非空
            if [ ! -s "${TMP_ZIP}" ]; then
              echo "[deploy] FAIL: zip 不存在或为空: ${TMP_ZIP}" >&2
              exit 4
            fi
            # 3) unzip 命令必须存在
            if ! command -v unzip >/dev/null 2>&1; then
              echo "[deploy] FAIL: 服务器未安装 unzip。请在服务器上安装后重试:" >&2
              echo "       共享主机: 控制面板找 PHP/SSH 扩展 或 联系运维" >&2
              echo "       Debian/Ubuntu: sudo apt-get install -y unzip" >&2
              echo "       CentOS/RHEL:   sudo yum install -y unzip" >&2
              exit 5
            fi

            # === 执行部署 ===
            BACKUP_DIR=""
            # 4) 插件目录已存在 → 备份到 /tmp 做回滚 (保留 1 份)
            if [ -d "${TARGET_DIR}" ]; then
              BACKUP_DIR="/tmp/wp-ai-customer-service.backup.$(date +%s)"
              echo "[deploy] 备份旧版本 -> ${BACKUP_DIR}"
              mv "${TARGET_DIR}" "${BACKUP_DIR}"
            fi

            echo "[deploy] 解压 ${TMP_ZIP} -> ${TARGET_DIR}"
            mkdir -p "${TARGET_DIR}"
            unzip -q -o "${TMP_ZIP}" -d "${TARGET_DIR}"

            # 5) 部署成功 → 删除 zip + 旧备份
            rm -f "${TMP_ZIP}"
            if [ -n "${BACKUP_DIR}" ]; then
              rm -rf "${BACKUP_DIR}"
            fi

            # 6) 写入部署元信息, 便于事后核对
            cat > "${TARGET_DIR}/DEPLOYMENT_META.txt" <<EOF
            Plugin:        wp-ai-customer-service
            Deployed at:   $(date -Iseconds)
            Deployed by:   GitHub Actions (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
            Tag:           ${GITHUB_REF_NAME}
            Runner:        $(hostname)
            SSH user:      $(whoami)
            Target dir:    ${TARGET_DIR}
            EOF

            echo "[deploy] OK"
            echo "  插件主入口: ${TARGET_DIR}/wp-ai-customer-service.php"
            echo "  文件数:     $(find "${TARGET_DIR}" -type f | wc -l)"
            echo "  总大小:     $(du -sh "${TARGET_DIR}" | cut -f1)"
